<script>
(()=>{const TARGET_WIDTH=544;const COLOR="#fff";const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);let isInIframe=!1;try{isInIframe=(window.self!==window.top)||(/Telegram/i.test(navigator.userAgent))}catch(e){isInIframe=!0}
window.innerWidth=TARGET_WIDTH;if(isInIframe){const actualWidth=document.documentElement.clientWidth;const actualHeight=document.documentElement.clientHeight;const scale=actualWidth/TARGET_WIDTH;window.innerHeight=actualHeight/scale}
var i1=setInterval(()=>{let canvas=document.querySelector("canvas");if(!canvas)return;clearInterval(i1);document.documentElement.style.cssText=`margin:0;padding:0;height:100%;background:${COLOR};`;document.body.style.cssText=`margin:0;padding:0;height:100%;background:${COLOR} url('bg1.jpg') center/cover;overflow:hidden;`;let container=document.createElement("div");container.style.cssText=`background:${COLOR};width:${TARGET_WIDTH}px;height:100%;position:relative;margin:auto;box-shadow:0 0 80px 10px #737`;document.body.appendChild(container);container.appendChild(canvas);if(isMobile||isInIframe){const applyScale=()=>{const actualWidth=document.documentElement.clientWidth;const actualHeight=document.documentElement.clientHeight;const scale=actualWidth/TARGET_WIDTH;if(isInIframe){window.innerHeight=actualHeight/scale}
Object.assign(container.style,{height:`${actualHeight / scale}px`,transform:`scale(${scale})`,transformOrigin:"top left",})};applyScale();if(isInIframe)window.addEventListener('resize',applyScale);}},0)})()
</script>
