	var MediaCache={};
	var MediaDebug=0;
	
						if(typeof Media=='undefined')
						{
							window.Media=function(fname1)
							{
								var this1=this;
									if(MediaDebug)console.log(this1);
								this1.src=fname1;
								this1.play=function(){if(MediaDebug)console.log("play:",this1.src)};
								this1.stop=function(){if(MediaDebug)console.log("stop:",this1.src)};
								this1.setVolume=function(a){if(MediaDebug)console.log("volume:",this1.src,a)};
							}

	function MediaPlaySound(fname1,loop1=1,stop1=false,channel1)
	{
		if(stop1==true)MediaSoundMixer.stopAll();
		
		if(MediaCache[fname1]==null)MediaCache[fname1]=new Media(fname1);//,function(){console.log("OK")},function(error){console.log("ERR",error)});
		var s1=MediaCache[fname1];
		
		s1.loop1=loop1;
		s1.channel1=channel1;
		s1.statusCallback=function(status)
		{
			/*console.log(status);*/
			if(status==4)
			{
				if(this.loop1>1)
				{
					this.play();
					this.setVolume(s1.channel1.soundTransform.volume);
					this.loop1--;
				}
				else
				{
					var i1=this.channel1.arr1.indexOf(this);
					if(i1!=-1)this.channel1.arr1.splice(i1,1);
					if(MediaDebug)console.log(this.channel1,i1)
				}
			}
		};
		
		if(s1.channel1.arr1.indexOf(s1)==-1)s1.channel1.arr1.push(s1);
		s1.play();
		s1.setVolume(s1.channel1.soundTransform.volume);
		
	}


	function MediaSoundTransform(volume1=1)
	{
		var this1=this;
		this1.volume=volume1;
	}

	function MediaSoundChannel(a=null,soundTransform1)
	{
		var this1=this;
			if(MediaDebug)console.log(this1);
			MediaSoundMixer.channels1.push(this1);
		this1.arr1=[];
		this1.soundTransform1=soundTransform1!=null?soundTransform1:new MediaSoundTransform(1);
		
		Object.defineProperty(this, "soundTransform", { get: function(){return this1.soundTransform1},set: function (t1) { this1.soundTransform1=t1;this1.updateVolume(); } });
		
		this1.stop=function()
		{
			if(MediaDebug)console.log("stop",this1);
			for(var i in this1.arr1)this1.arr1[i].loop1=1;
			for(var i in this1.arr1)this1.arr1[i].stop();
			this1.arr1.splice(0,this1.arr1.length);
		}
		
		this1.updateVolume=function()
		{
			for(var i in this1.arr1)this1.arr1[i].setVolume(this1.soundTransform1.volume*MediaSoundMixer.soundTransform1.volume);
		}
	}
	
	function MediaSoundMixer(){}
	MediaSoundMixer.channels1=[]
	MediaSoundMixer.stopAll=function()
	{
		for(var i in this.channels1)this.channels1[i].stop();
	}
	MediaSoundMixer.updateVolume=function()
	{
		for(var i in this.channels1)this.channels1[i].updateVolume();
	}
	MediaSoundMixer.soundTransform1=new MediaSoundTransform(1);
	Object.defineProperty(MediaSoundMixer, "soundTransform", { get: function(){return this.soundTransform1},set: function (t1) { this.soundTransform1=t1;this.updateVolume(); } });
