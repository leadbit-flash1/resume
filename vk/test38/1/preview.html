/* ============================================================ 2. shaders */
/* ---- level theme (hardcoded): 0 gray metal, 1 white plastic. Same deck, same everything; the plastic theme turns the level's
   grays into shades of white (tinted ones keep their tint; yellow / black hazard, amber stripes, lamps, crates stay) and gives
   the level a cheap fake reflection: the reflected view ray looks up a procedural "room" (sky gradient + ceiling-light bands),
   no extra pass, so it costs a few ALU ops on old phones. Gray metal gets a faint one. */
const THEME = 1;
const THEME_REFL = [.14, .32][THEME], THEME_FILL = [0, .2][THEME];   // fake reflection strength; fill light (white rooms bounce light around)
const PAL = c => {   // a level colour for this theme
  if (!THEME || Math.max(...c) - Math.min(...c) > .13) return c;
  const l = (c[0] + c[1] + c[2]) / 3, v = l < .13 ? l * 2 : .5 + l * 1.05;
  return c.map(x => clamp(v + (x - l), 0, 1));
};
function program(vs, fs) {
  const p = gl.createProgram();
  for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return {p, u};
}
// --- lit mesh: hemisphere + key light + fake hangar reflection (chrome), emissive, fog
const MESH = program(`#version 300 es
layout(location=0) in vec3 aP; layout(location=1) in vec3 aN; layout(location=2) in vec3 aC; layout(location=3) in vec3 aM;
layout(location=4) in vec2 aT; layout(location=5) in vec4 aJ; layout(location=6) in vec4 aW;
uniform mat4 uVP, uM, uB[32]; uniform bool uSkin; out vec3 vW, vN, vC, vM; out vec2 vT;
void main(){
  mat4 S = uSkin ? aW.x * uB[int(aJ.x)] + aW.y * uB[int(aJ.y)] + aW.z * uB[int(aJ.z)] + aW.w * uB[int(aJ.w)] : mat4(1.0);
  vec4 w = uM * S * vec4(aP, 1.0); vW = w.xyz; vN = mat3(uM) * mat3(S) * aN; vC = aC; vM = aM; vT = aT; gl_Position = uVP * w; }`,
`#version 300 es
precision highp float;
in vec3 vW, vN, vC, vM; in vec2 vT; uniform vec3 uEye, uAdd; uniform float uEmit, uFog, uRefl, uFill; uniform bool uTexOn, uNrmOn; uniform sampler2D uTex, uNrm; out vec4 o;
uniform bool uRT; uniform sampler2D uLM0, uLM1, uLMD; uniform vec4 uR1[2], uRD; uniform float uDL, uGW, uHI;   // RT_LIGHTS
vec3 rtLight(vec3 p, vec3 n) {   // RT_LIGHTS: this floor's lightmap (+ the live window if you are on that floor), x4 (stored / 4)
  vec2 q = p.xz + n.xz * 0.12, qd = (q - uRD.xy) / uRD.zw;   // walls sample 12 cm into the room
  bool up = false; vec3 L = vec3(0.0);
  if (p.y > uHI - 0.1) for (int k = 0; k < 2; k++) {   // upper floor of a two-floor room: its half of the LM1 atlas
    vec2 q1 = (q - uR1[k].xy) / uR1[k].zw;
    if (all(greaterThanEqual(q1, vec2(0.0))) && all(lessThan(q1, vec2(1.0)))) { up = true; L = texture(uLM1, vec2((q1.x + float(k)) * 0.5, q1.y)).rgb; }
  }
  if (!up) L = texture(uLM0, q / uGW).rgb;
  // live lights (flashes, faulty lamps) exist only in the 24 m window round you: fade them out over its outer 3 m, else their
  // light stopped dead along the window's border - a faint straight edge out in the distance that moved with you
  if (uDL == (up ? 1.0 : 0.0) && all(greaterThanEqual(qd, vec2(0.0))) && all(lessThan(qd, vec2(1.0)))) {
    vec2 e = min(qd, 1.0 - qd) * uRD.zw; L += texture(uLMD, qd).rgb * smoothstep(0.0, 3.0, min(e.x, e.y)); }
  return L * 4.0;
}
void main(){
  vec3 C = vC;
  if (uTexOn) { vec4 t = texture(uTex, vT); if (t.a < 0.5) discard; C *= t.rgb; }   // monster skin: alpha-cut teeth, fins, claws
  vec3 n = normalize(vN);
  if (uNrmOn) {   // tangent-space normal map, tangent frame from screen derivatives (no tangent attribute; mirrored UVs just work)
    vec3 dp1 = dFdx(vW), dp2 = dFdy(vW), a = cross(dp2, n), b = cross(n, dp1); vec2 t1 = dFdx(vT), t2 = dFdy(vT);
    vec3 T = a * t1.x + b * t2.x, B = a * t1.y + b * t2.y; float k = inversesqrt(max(max(dot(T, T), dot(B, B)), 1e-20));
    vec3 m = texture(uNrm, vT).xyz * 2.0 - 1.0; n = normalize(T * k * m.x - B * k * m.y + n * m.z);   // glTF v runs down: flip green
  } vec3 v = normalize(uEye - vW); if (dot(n, v) < 0.0) n = -n;
  vec3 L = normalize(vec3(-0.35, 0.85, 0.4)); float dif = max(dot(n, L), 0.0);
  vec3 amb = mix(vec3(0.09, 0.085, 0.08), vec3(0.30, 0.33, 0.38), 0.5 + 0.5 * n.y);
  vec3 r = reflect(-v, n);
  vec3 env = mix(vec3(0.05, 0.045, 0.045), vec3(0.5, 0.55, 0.64), smoothstep(-0.25, 0.55, r.y));
  env += vec3(1.1) * smoothstep(0.82, 0.97, abs(sin(r.x * 5.0 + r.z * 1.5))) * smoothstep(0.35, 0.8, r.y);
  env += vec3(0.95, 0.85, 0.7) * exp(-r.y * r.y * 45.0) * 0.55;
  float metal = vM.x, gloss = vM.z, fres = pow(1.0 - max(dot(n, v), 0.0), 4.0);
  vec3 lit = amb + dif * vec3(1.0, 0.95, 0.88), rk = vec3(1.0);
  if (uRT) { lit = rtLight(vW, n) * (0.75 + 0.35 * dif); rk = min(lit, vec3(1.2)); }   // RT_LIGHTS: lamps replace the sun
  vec3 col = C * lit * (1.0 - metal * 0.7);
  col += env * mix(C * 1.1, vec3(1.0), fres * 0.6) * metal * rk;
  col += pow(max(dot(n, normalize(L + v)), 0.0), 8.0 + gloss * 160.0) * (0.15 + metal * 0.9) * rk;
  col += env * uRefl * (0.3 + 0.7 * fres) * rk + C * uFill;   // the level theme: fake reflection + bounce fill (both 0 on everything else)
  col = mix(col, C * (1.1 + uEmit * 1.6), vM.y) + uAdd;
  o = vec4(mix(col, vec3(0.07, 0.075, 0.09), 1.0 - exp(-length(uEye - vW) * uFog)), 1.0);
}`);
// --- one instanced sprite program for every effect
// kinds: 0 glow, 1 fire (Lacuni), 2 bolt (Lightning), 3 smoke, 4 forcefield orb/shell, 5 ring, 6 streak, 7 star
const SPR = program(`#version 300 es
layout(location=0) in vec2 aQ;
layout(location=1) in vec3 iPos; layout(location=2) in vec3 iAxis; layout(location=3) in vec2 iSize;
layout(location=4) in vec4 iMisc; layout(location=5) in vec3 iTint; layout(location=6) in vec4 iSeed;
uniform mat4 uVP; uniform vec3 uEye, uR, uU; uniform float uTime;
out vec2 vUv, vSeed; out float vKind, vFade, vErode, vTime, vAspect, vVar; out vec3 vTint;
void main(){
  vec3 p;
  if (dot(iAxis, iAxis) > 1e-10) {               // beam from iPos to iPos + iAxis
    vec3 d = normalize(iAxis), side = normalize(cross(d, normalize(iPos + iAxis * 0.5 - uEye)));
    p = iPos + iAxis * (aQ.x + 0.5) + side * aQ.y * iSize.y; vAspect = length(iAxis) / max(iSize.y, 1e-4);
  } else if (iMisc.y > 7.5 && iMisc.y < 8.5) {    // floor decal: lies flat in XZ
    float s = sin(iMisc.x), c = cos(iMisc.x); vec2 q = vec2(aQ.x * c - aQ.y * s, aQ.x * s + aQ.y * c) * iSize;
    p = iPos + vec3(q.x, 0.0, q.y); vAspect = 1.0;
  } else {                                       // camera-facing billboard
    float s = sin(iMisc.x), c = cos(iMisc.x); vec2 q = vec2(aQ.x * c - aQ.y * s, aQ.x * s + aQ.y * c) * iSize;
    p = iPos + uR * q.x + uU * q.y; vAspect = 1.0;
  }
  vUv = aQ + 0.5; vKind = iMisc.y; vFade = iMisc.z; vErode = iMisc.w; vTint = iTint;
  vSeed = iSeed.xy; vTime = uTime + iSeed.z; vVar = iSeed.w; gl_Position = uVP * vec4(p, 1.0);
}`,
`#version 300 es
precision highp float;
in vec2 vUv, vSeed; in float vKind, vFade, vErode, vTime, vAspect, vVar; in vec3 vTint;
uniform sampler2D uFire1, uFire2, uBolt, uSplat, uField; out vec4 o;
float flameMask(vec2 uv){ float y = clamp(uv.y, 0.0, 1.0), w = max(0.46 * pow(1.0 - y * 0.92, 0.65), 0.02);
  return (1.0 - smoothstep(0.32, 1.0, abs((uv.x - 0.5) / w))) * smoothstep(0.0, 0.22, y) * (1.0 - smoothstep(0.52, 0.98, y)); }
float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
void main(){
  vec2 uv = vUv, c = uv - 0.5; float r = length(c) * 2.0, k = vKind;
  vec2 du = dFdx(uv), dv = dFdy(uv);             // taken in uniform flow: texture() LOD inside branches is undefined
  if (k < 0.5) {                                 // GLOW: hot core + soft halo (var 1 = screen-edge vignette)
    if (vVar > 0.5) { float e = smoothstep(0.35, 1.25, r); o = vec4(vTint * e * vFade, e * vFade * 0.7); return; }
    float core = exp(-r * r * 22.0), halo = exp(-r * r * 4.0) * (1.0 - smoothstep(0.75, 1.0, r));
    o = vec4((vTint * halo + mix(vTint, vec3(1.0), 0.65) * core * 1.6) * vFade, core * 0.2 * vFade); return;
  }
  if (k < 1.5) {                                 // FIRE: (Tex1 * Tex2) * 2, erosion, white-hot core
    vec2 fu = vVar > 0.5 ? vec2(uv.y, uv.x) : uv;            // var 1: beam teardrop along the axis
    vec2 uv1 = fu + vec2(0.03, -0.34) * vTime + vSeed, uv2 = fu * 0.5 + vec2(-0.05, -0.57) * vTime + vSeed * 1.7;
    vec4 c1 = texture(uFire1, uv1), c2 = texture(uFire2, uv2);

  const r = LV.here, a = LV.active, done = LV.rooms.filter(x => x.state === 'clear').length - 1;
  HUD.room = r ? `ROOM ${r.id}  DEPTH ${r.depth}${r === LV.exit ? '  EXIT' : r.id ? '' : '  START'}  ` +
    (a === r ? `WAVE ${a.nw - a.waves.length}/${a.nw}  ALIVE ${mons.length}` : r.state) : 'CORRIDOR';
  HUD.deck = `DECK ${LV.seed}   CLEARED ${done}/${ROOMS - 1}   KILLS ${PL.kills}  BEST ${PL.best}`;
  HUD.extra = r && !r.id ? TARGETS.map(t => `${t.name} ${t.hits}/${Math.round(t.dmg)}`).join('   ') + `   DPS ${Math.round(STATS.dps || 0)}` : '';

const HUD = {room: '', deck: '', extra: '', gun: ''};
const WHITE = (() => { const c = document.createElement('canvas'); c.width = c.height = 4; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 4, 4); return uiTex(c); })();
function drawHUD() {
  const L = clamp(cv.height / 24, 16, 36), lowHp = PL.hp < 35 ? [1, .35, .3, 1] : [1, 1, 1, 1];
  const red = PL.flash * .35 + (PL.dead ? .2 + .45 * ease(3 - PL.dead, 0, 2.5) : 0);   // hit flash; dying: the screen bleeds out
  if (red > .01) uiQuad(WHITE, 0, 0, cv.width, cv.height, 0, 0, 1, 1, [1, .04, .02, red]);
  text(L * .6, L * .5, L * .8, HUD.room); text(L * .6, L * 1.4, L * .6, HUD.deck); if (HUD.extra) text(L * .6, L * 2.2, L * .55, HUD.extra);
  text(cv.width / 2, L * .5, L * 1.3, 'HP ' + Math.ceil(PL.hp), 2, lowHp);
  text(cv.width / 2, L * 2, L * .75, HUD.gun, 2);
  const x0 = lvlNeed(PL.lvl - 1) * (PL.lvl > 1), k = clamp((PL.xp - x0) / (lvlNeed(PL.lvl) - x0), 0, 1), bw = L * 7, bx = cv.width / 2 - bw / 2, by = L * 3.05;
  text(bx - L * .3, by - L * .25, L * .6, 'LV ' + PL.lvl, 1, [1, .85, .45, 1]);   // level + XP bar (Crimsonland style)
  uiQuad(WHITE, bx, by, bw, L * .22, 0, 0, 1, 1, [.3, .25, .4, .6]); uiQuad(WHITE, bx, by, bw * k, L * .22, 0, 0, 1, 1, [1, .8, .35, .9]);
  if (clock - msg.t < 2.5) text(cv.width / 2, cv.height * .3, L * 1.4, msg.text, 2, [1, .85, .45, 1]);
  if (!LOAD.done) text(cv.width / 2, cv.height * .45, L, `LOADING ${LOAD.n}/${LOAD.of}`, 2);
  else if (!W) text(cv.width / 2, cv.height * .45, L * .7, 'NO WEAPONS - SERVE THIS FOLDER OVER HTTP', 2, [1, .5, .4, 1]);
  if (document.body.classList.contains('touch')) {
    drawPad();
    if (cv.height > cv.width) text(cv.width / 2, cv.height * .55, L * 1.4, 'ROTATE DEVICE', 2, [1, .85, .45, 1]);

function drawMap() {   // M: the grid as it is (rooms by state, doors open/shut, crates), you, and what hunts you
  const c = $('map'); if (c.style.display === 'none') return;
  const g = c.getContext('2d'), s = c.width / GW;
  g.fillStyle = '#05060a'; g.fillRect(0, 0, c.width, c.height);
  for (let j = 0; j < GW; j++) for (let i = 0; i < GW; i++) {
    const v = cellAt(i, j); if (v === SOLID) { if (LV.lay[j * GW + i] === 4) { g.fillStyle = '#c8a020'; g.fillRect(i * s, j * s, s, s); } continue; }
    const r = LV.rooms[LV.roomOf[j * GW + i]];
    const fl = LV.lay[j * GW + i];
    g.fillStyle = fl & 1 ? '#5c6c80' : fl & 2 ? '#3d4b5e' : v === PIT ? '#000' : v === CRATE ? '#7a5a32' : v === DOOR ? (blocked(i, j) ? '#e33' : '#3c6') : !r ? '#3a3f4a' :
      r.state === 'active' ? '#5a2424' : r.state === 'clear' ? '#2f4a5a' : r === LV.exit ? '#5a3a6a' : '#2a2e36';
    g.fillRect(i * s, j * s, s, s);

  g.strokeStyle = '#ff6'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, z); g.lineTo(x + Math.sin(yaw) * 9, z - Math.cos(yaw) * 9); g.stroke();
  g.fillStyle = '#ff6'; g.beginPath(); g.arc(x, z, 3, 0, 6.283); g.fill();
}
